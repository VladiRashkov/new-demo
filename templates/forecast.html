{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 col-sm-12 text-center">

            <h2 class="mb-4">Temperature Forecast</h2>

            {% if status_message %}
            <div class="alert alert-warning font-weight-bold mb-4">
                {{ status_message }}
            </div>
            {% endif %}

            <div class="card mb-4">
                <div class="card-body p-2">
                    {{ chart_html|safe }}
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body p-2">
                    {{ anomaly_chart_html|safe }}
                </div>
            </div>

            <div class="card">
                <div class="card-body p-2">
                    {{ performance_chart_html|safe }}
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
