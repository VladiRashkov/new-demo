<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AdminLTE Sidebar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Embedded CSS -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .main-sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            height: 100vh;
            position: fixed;
        }

        .brand-link {
            display: flex;
            align-items: center;
            padding: 1rem;
            text-decoration: none;
            color: white;
            border-bottom: 1px solid #4f5962;
        }

        .brand-image {
            width: 30px;
            margin-right: 10px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 56px);
            /* Adjust for brand height */
            padding: 0.5rem;
        }

        .user-panel {
            display: flex;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #4f5962;
        }

        .user-panel .info a {
            color: white;
            text-decoration: none;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .nav-main {
            flex-grow: 1;
        }

        .nav-bottom {
            margin-top: auto;
        }

        .nav-sidebar {
            padding-left: 0;
        }

        .nav-item {
            list-style: none;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: white;
            text-decoration: none;
        }

        .nav-link:hover {
            background-color: #495057;
        }

        .nav-icon {
            margin-right: 10px;
        }

        .active {
            background-color: #007bff;
        }

        x
    </style>
</head>

<body>

    <!-- Main Sidebar Container -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Brand Logo -->
        <a href="/" class="brand-link">
            <img src="{{ url_for('static', filename='assets/img/AdminLTELogo.png') }}" alt="AdminLTE Logo"
                class="brand-image img-circle elevation-3" style="opacity: .8">
            <span class="brand-text font-weight-light">AdminLTE 3</span>
        </a>

        <!-- Sidebar -->
        <div class="sidebar">
            <!-- User Panel -->
            <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                <div class="info">
                    <a href="#" class="d-block">Vladislav</a>
                </div>
            </div>

            <!-- Sidebar Menu -->
            <nav class="mt-2 sidebar-nav">
                <!-- Main navigation items -->
                <ul class="nav nav-pills nav-sidebar flex-column nav-main" role="menu" data-accordion="false">
                    <li class="nav-item">
                        <a href="{{ url_for('forecast.temperature_chart') }}"
                            class="nav-link {% if 'forecast' in segment %}active{% endif %}">
                            <i class="nav-icon fas fa-chart-line"></i>
                            <p>Forecast Charts</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('anomalies.anomalies') }}"
                            class="nav-link {% if 'anomalies' in segment %}active{% endif %}">
                            <i class="nav-icon fas fa-exclamation-triangle"></i>
                            <p>Anomalies</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('alerts.alerts') }}"
                            class="nav-link {% if 'alert_history' in segment %}active{% endif %}">
                            <i class="nav-icon fas fa-history"></i>
                            <p>Alert History</p>
                        </a>
                    </li>
                </ul>

                <ul class="nav nav-pills nav-sidebar flex-column nav-main">
                    <li class="nav-item">
                        <a href="javascript:void(0)" class="nav-link factory-link">
                            <i class="nav-icon fas fa-industry"></i>
                            <p>Завод "Сердика"</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="javascript:void(0)" class="nav-link factory-link">
                            <i class="nav-icon fas fa-industry"></i>
                            <p>Завод "Приста"</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="javascript:void(0)" class="nav-link factory-link">
                            <i class="nav-icon fas fa-industry"></i>
                            <p>Завод "Мадара"</p>
                        </a>
                    </li>
                </ul>


                <!-- Settings pinned to bottom -->
                <ul class="nav nav-pills nav-sidebar flex-column nav-bottom">
                    <li class="nav-item">
                        <a href="javascript:void(0)" class="nav-link">
                            <i class="nav-icon fas fa-cog"></i>
                            <p>Settings</p>
                        </a>
                    </li>
                </ul>
                <ul class="nav nav-pills nav-sidebar flex-column nav-bottom">
                    <li class="nav-item">
                        <a href="javascript:void(0)" class="nav-link">
                            <i class="nav-icon fas fa-question-circle"></i>
                            <p>Help & support</p>
                        </a>
                    </li>
                </ul>
                <ul class="nav nav-pills nav-sidebar flex-column nav-bottom">
                    <li class="nav-item">
                        <a href="javascript:void(0)" class="nav-link">
                            <i class="nav-icon fas fa-sign-out-alt"></i>
                            <p>Logout</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

</body>

</html>
