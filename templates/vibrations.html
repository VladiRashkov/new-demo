{% extends 'base.html' %}
{% block content %}
<div class="content-header text-center">
    <div class="container-fluid">
        <h1 class="m-0 text-dark">Vibration Forecast & Diagnostics</h1>
    </div>
</div>

<div class="content">
    <div class="container-fluid">

        <!-- Status Message -->
        {% if status_message %}
        <div class="alert alert-info text-center mb-4" style="font-size: 1.1rem;">
            {{ status_message }}
        </div>
        {% endif %}

        <!-- Forecast Chart -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card h-100">
                    <div class="card-header bg-dark text-white">
                        <strong>Forecast</strong>
                    </div>
                    <div class="card-body">
                        {{ chart_html|safe }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Anomaly Chart -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card h-100">
                    <div class="card-header bg-danger text-white">
                        <strong>Anomalies</strong>
                    </div>
                    <div class="card-body">
                        {{ anomaly_chart_html|safe }}
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
